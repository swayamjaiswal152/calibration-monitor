# Render Blueprint — provisions the full stack from this repo.
# Dashboard -> New -> Blueprint -> connect this repo, or `render blueprint launch`.
#
# Free-tier layout: the drift worker runs in-process inside the API
# (RUN_WORKER_IN_PROCESS=true) as a daemon thread, because Render's free plan
# has no Background Workers. To decouple it, add a `type: worker` service with
# the same Docker build and `dockerCommand: python -m app.worker` (requires a
# paid instance).

databases:
  - name: calib-db
    databaseName: calibration
    user: postgres
    plan: free

services:
  # Redis — Pub/Sub event bus + distributed worker lock
  - type: redis
    name: calib-redis
    plan: free
    ipAllowList: []          # internal-only (no public access)

  # FastAPI API (also hosts the in-process drift worker on free tier)
  - type: web
    name: calib-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT             # Dockerfile binds uvicorn to :8000; route to it
        value: "8000"
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: TARGET_COVERAGE
        value: "0.9"
      - key: DATABASE_URL
        fromDatabase:
          name: calib-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: calib-redis
          property: connectionString
      - key: SLACK_WEBHOOK_URL
        sync: false           # set in the dashboard (secret, optional)

  # React dashboard (static build; talks to the API's public origin)
  - type: web
    name: calib-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL     # bare host; api.ts normalises to https/wss
        fromService:
          type: web
          name: calib-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
